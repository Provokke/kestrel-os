name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm nasm qemu-system-x86 python3
      - name: Build kernel
        run: make -j2 kernel
      - name: Run all tests
        run: make test
      - name: Benchmarks
        run: make bench
